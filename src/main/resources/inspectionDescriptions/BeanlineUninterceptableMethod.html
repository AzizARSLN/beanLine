<body>
Reports transaction, asynchronous, cache and retry annotations on <code>private</code>, <code>final</code> or
<code>static</code> methods. A container proxy cannot intercept these methods, so the annotation may be silently
ignored.
<p>A quick fix makes <code>private</code> methods public and removes <code>final</code>.</p>
